name: Org Health Monitor
description: Daily health check across all PAI Universe repos
on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.pai-universe/.github/workflows/org-health.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  health-check:
    name: PAI Universe Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PAI Universe
        uses: actions/checkout@v4
        with:
          path: pai-universe
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'pnpm'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "9"
          run_install: false
      
      - name: Run health check script
        run: |
          cd pai-universe
          chmod +x scripts/health-check.sh
          ./scripts/health-check.sh
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
      
      - name: Upload health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: health-report-${{ github.run_id }}
          path: pai-universe/.pai-universe/health-report-*.md
          retention-days: 30
      
      - name: Create issue on degradation
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reports = fs.readdirSync('pai-universe/.pai-universe').filter(f => f.startsWith('health-report-') && f.endsWith('.md'));
            if (reports.length === 0) return;
            
            const latest = reports.sort().pop();
            const content = fs.readFileSync(`pai-universe/.pai-universe/${latest}`, 'utf8');
            
            const failedRepos = content.match(/\| .*? \| ❌ \|/g) || [];
            const warningRepos = content.match(/\| .*? \| 🟡 \|/g) || [];
            
            if (failedRepos.length > 0 || warningRepos.length > 0) {
              const title = `🏥 Health Degradation: ${failedRepos.length} failing, ${warningRepos.length} warnings`;
              const body = `## Daily Health Check Failed\n\n**Run:** ${process.env.GITHUB_RUN_ID}\n**Date:** ${new Date().toISOString()}\n\n### Failing Repos (🔴)\n${failedRepos.length > 0 ? failedRepos.map(l => `- ${l.replace(/\|/g, '').trim()}`).join('\n') : 'None'}\n\n### Warning Repos (🟡)\n${warningRepos.length > 0 ? warningRepos.map(l => `- ${l.replace(/\|/g, '').trim()}`).join('\n') : 'None'}\n\n### Full Report\n\`\`\`\n${content}\n\`\`\`\n\n---\n*Auto-generated by PAI Universe Health Monitor*`;
              
              // Check if issue already exists
              const { data: issues } = await github.rest.issues.listForRepo({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                labels: ['health:degraded']
              });
              
              if (issues.length === 0) {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['health:degraded', 'automated']
                });
              } else {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issues[0].number,
                  title,
                  body
                });
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  dependency-update:
    name: Weekly Dependency Audit
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: pai-universe
          fetch-depth: 0
      
      - name: Check for outdated dependencies
        run: |
          cd pai-universe
          REPOS=(
            "layer-1-identity/AxiomID"
            "layer-1-identity/axiomid-piverify"
            "layer-3-agent-runtime/pai-agent-kit"
            "layer-4-mcp-gateway/pai-mcp"
            "layer-5-memory/pai-memory"
            "layer-6-discovery/ADP"
            "layer-7-workspace/PAI-Gspace"
            "layer-7-workspace/pai-cli"
            "layer-7-workspace/pai-docs"
            "layer-7-workspace/pai-website"
            "infrastructure/pai-atom"
            "infrastructure/pai-skills"
            "infrastructure/hermes-agent"
            "infrastructure/pi-worker"
          )
          
          echo "# Dependency Audit Report" > dependency-audit.md
          echo "**Date:** $(date)" >> dependency-audit.md
          echo "" >> dependency-audit.md
          
          for repo in "${REPOS[@]}"; do
            if [ -f "$repo/package.json" ]; then
              echo "## $repo" >> dependency-audit.md
              cd "$repo"
              pnpm outdated --json 2>/dev/null | jq -r '.[] | "\(.name): \(.current) -> \(.latest) (\(.type))"' >> ../dependency-audit.md 2>/dev/null || echo "  (check failed)" >> ../dependency-audit.md
              cd - > /dev/null
              echo "" >> dependency-audit.md
            fi
          done
      
      - name: Create dependency PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GH_TOKEN }}
          path: pai-universe
          commit-message: "chore: weekly dependency updates"
          title: "🔄 Weekly Dependency Updates"
          body: |
            Automated weekly dependency audit.
            
            See `dependency-audit.md` for details.
          branch: chore/weekly-deps
          delete-branch: true