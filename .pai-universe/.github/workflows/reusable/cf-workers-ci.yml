name: Reusable Cloudflare Workers CI
description: CI for Cloudflare Workers (Wrangler) projects
on:
  workflow_call:
    inputs:
      working-directory:
        description: "Working directory (relative to repo root)"
        required: false
        type: string
        default: "."
      wrangler-config:
        description: "Wrangler config file name"
        required: false
        type: string
        default: "wrangler.jsonc"
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      pnpm-version:
        description: "pnpm version"
        required: false
        type: string
        default: "9"
      deploy-preview:
        description: "Deploy preview on PR"
        required: false
        type: boolean
        default: false
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  cf-workers-ci:
    name: CF Workers CI (${{ inputs.working-directory }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}
          run_install: false
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'pnpm'
          cache-dependency-path: |
            ${{ inputs.working-directory }}/pnpm-lock.yaml
            ${{ inputs.working-directory }}/package-lock.json
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Typecheck
        run: pnpm run typecheck 2>&1 || pnpm run tsc --noEmit 2>&1 || true
      
      - name: Lint
        run: pnpm run lint 2>&1 || true
      
      - name: Test
        run: pnpm test -- --ci --runInBand 2>&1 || true
      
      - name: Build (wrangler deploy --dry-run)
        run: npx wrangler deploy --dry-run --config ${{ inputs.wrangler-config }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: Deploy preview (PR only)
        if: inputs.deploy-preview == true && github.event_name == 'pull_request'
        run: |
          PREVIEW_NAME="pr-${{ github.event.pull_request.number }}-${{ github.sha::8 }}"
          npx wrangler deploy --env preview --name "${PREVIEW_NAME}" --config ${{ inputs.wrangler-config }}
          echo "PREVIEW_URL=https://${PREVIEW_NAME}.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev" >> $GITHUB_STEP_SUMMARY
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      
      - name: Comment preview URL
        if: inputs.deploy-preview == true && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.PREVIEW_URL;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `🚀 **Preview deployed**: ${url}\n\n*Auto-deployed from commit ${{ github.sha }}*`
            });
        env:
          PREVIEW_URL: ${{ steps.deploy-preview.outputs.PREVIEW_URL }}