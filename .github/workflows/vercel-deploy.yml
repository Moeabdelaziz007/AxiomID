name: Deploy to Vercel (CD)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  vercel:
    name: Vercel Production Deploy
    uses: pai-list/.github/.github/workflows/vercel-deploy.yml@main
    with:
      project-id: prj_X4BTJe1rDPtxYzIELS2O3uc8q9mU
      build-command: "npm run build"
      install-command: "npm install"
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
